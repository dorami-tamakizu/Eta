<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>魂の結束</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;pointer-events:none}.pill{background:#0009;border:1px solid #ffffff33;border-radius:11px;padding:7px 9px;font-weight:800;font-size:12px;white-space:nowrap}.hp{flex:1}.bar{height:6px;margin-top:4px;background:#ffffff22;border-radius:8px;overflow:hidden}.fill{height:100%;background:#fff}.stop{pointer-events:auto;background:#101a2ddd;color:#fff;border:1px solid #ffffff55;border-radius:11px;padding:7px 10px;font-weight:900}.controls{position:fixed;z-index:5;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.btn{background:#101a2ddd;color:#fff;border:1px solid #ffffff55;border-radius:16px;font-weight:800;touch-action:none}.iconbtn{width:82px;height:82px;padding:0;overflow:hidden;position:relative;background:#101a2ddd;transition:filter .05s,transform .05s,box-shadow .05s}.iconbtn img{width:100%;height:100%;display:block;object-fit:cover}.iconbtn.pressed{filter:brightness(2.2);transform:scale(.93);box-shadow:0 0 22px 8px #fff}.iconbtn.pressed img{opacity:.58}.skills{display:flex;gap:9px}.gauge{position:absolute;left:7px;right:7px;bottom:5px;height:5px;background:#0009;border-radius:8px;overflow:hidden;border:1px solid #ffffff55}.gauge>i{display:block;height:100%;background:#fff}.ov{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#020610e9;padding:24px;text-align:center}.hide{display:none}.card{max-width:400px}.card h1,.card h2{margin:0 0 16px}.title{font-size:36px;letter-spacing:.12em;text-shadow:0 3px 16px #000}.big{padding:13px 24px;font-size:17px}.result{line-height:1.8}#actionName{position:fixed;z-index:6;top:40%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 5px #000,0 0 10px #000;pointer-events:none;opacity:0;transition:opacity .06s;white-space:nowrap}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="pill hp">HP <span id="hp">20/20</span><div class="bar"><div id="hpf" class="fill" style="width:100%"></div></div></div><div class="pill">TIME <span id="time">0.0</span></div><div class="pill">FINISH <span id="fin">0</span>/30</div><button id="stop" class="stop">STOP</button></div><div id="actionName"></div><div class="controls"><button id="guard" class="btn iconbtn" aria-label="防御"><img src="assets/防御.png" alt=""></button><div class="skills"><button id="s1" class="btn iconbtn" aria-label="水波斬"><img src="assets/水波斬.png" alt=""><span class="gauge"><i id="g1" style="width:100%"></i></span></button><button id="s2" class="btn iconbtn" aria-label="大陸斬"><img src="assets/大陸斬.png" alt=""><span class="gauge"><i id="g2" style="width:100%"></i></span></button></div></div><div id="intro" class="ov"><div class="card"><h1 class="title">魂の結束</h1><button id="start" class="btn big">START</button></div></div><div id="pause" class="ov hide"><div class="card"><h2>PAUSED</h2><button id="resume" class="btn big">RESUME</button></div></div><div id="result" class="ov hide"><div class="card"><h2 id="resultTitle"></h2><div id="resultText" class="result"></div><button id="retry" class="btn big">RETRY</button></div></div><script src="bgm.js"></script><script src="game.js"></script><script>(()=>{const n=document.getElementById('actionName'),cv=document.getElementById('game');let lane=1,timer=0,startX=0;function pos(){n.style.left=(lane===0?'25%':lane===2?'75%':'50%')}function show(s,ms){clearTimeout(timer);n.textContent=s;pos();n.style.opacity='1';if(ms)timer=setTimeout(()=>n.style.opacity='0',ms)}function hide(){clearTimeout(timer);n.style.opacity='0'}function press(b,hold=220){b.classList.add('pressed');clearTimeout(b._pt);b._pt=setTimeout(()=>b.classList.remove('pressed'),hold)}const g=document.getElementById('guard'),s1=document.getElementById('s1'),s2=document.getElementById('s2');g.addEventListener('pointerdown',()=>{g.classList.add('pressed');show('防御',0)});['pointerup','pointercancel','pointerleave'].forEach(e=>g.addEventListener(e,()=>{g.classList.remove('pressed');hide()}));s1.addEventListener('pointerdown',()=>{press(s1);show('水波斬',460)});s2.addEventListener('pointerdown',()=>{press(s2);show('大陸斬',520)});cv.addEventListener('pointerdown',e=>startX=e.clientX);cv.addEventListener('pointerup',e=>{let dx=e.clientX-startX;if(Math.abs(dx)>30){lane=Math.max(0,Math.min(2,lane+(dx<0?-1:1)));pos()}});document.getElementById('retry').addEventListener('click',()=>{lane=1;hide()});document.getElementById('start').addEventListener('click',()=>{lane=1;hide()});document.getElementById('stop').addEventListener('click',hide)})();</script></body></html>
