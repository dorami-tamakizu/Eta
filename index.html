<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>魂の結束</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;pointer-events:none}.pill{background:#0009;border:1px solid #ffffff33;border-radius:11px;padding:7px 9px;font-weight:800;font-size:12px;white-space:nowrap}.hp{flex:1}.bar{height:6px;margin-top:4px;background:#ffffff22;border-radius:8px;overflow:hidden}.fill{height:100%;background:#fff}.stop{pointer-events:auto;background:#101a2ddd;color:#fff;border:1px solid #ffffff55;border-radius:11px;padding:7px 10px;font-weight:900}.controls{position:fixed;z-index:5;left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.btn{background:#101a2ddd;color:#fff;border:1px solid #ffffff55;border-radius:16px;font-weight:800;touch-action:none;-webkit-tap-highlight-color:transparent}.iconbtn{width:min(118px,calc((100vw - 24px)/3));height:min(118px,calc((100vw - 24px)/3));padding:0;overflow:hidden;position:relative;background:#101a2ddd}.iconbtn img{position:absolute;width:225%;height:225%;max-width:none;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;-webkit-user-drag:none;filter:hue-rotate(180deg) saturate(.72) brightness(1.08)}.iconbtn::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.iconbtn.flash::after{animation:tapFlash .32s ease-out}@keyframes tapFlash{0%{opacity:0}18%{opacity:.78}48%{opacity:.12}72%{opacity:.58}100%{opacity:0}}.skills{display:flex;gap:6px}.gauge{position:absolute;z-index:2;left:7px;right:7px;bottom:5px;height:5px;background:#0009;border-radius:8px;overflow:hidden;border:1px solid #ffffff55}.gauge>i{display:block;height:100%;background:#fff}.ov{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#020610e9;padding:24px;text-align:center}.hide{display:none}.card{max-width:400px}.card h1,.card h2{margin:0 0 16px}.title{font-size:36px;letter-spacing:.12em;text-shadow:0 3px 16px #000}.big{padding:13px 24px;font-size:17px}.result{line-height:1.8}#actionName{position:fixed;z-index:6;top:40%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 5px #000,0 0 10px #000;pointer-events:none;opacity:0;transition:opacity .06s;white-space:nowrap}.moveArrow{font-size:42px!important}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="pill hp">HP <span id="hp">20/20</span><div class="bar"><div id="hpf" class="fill" style="width:100%"></div></div></div><div class="pill">TIME <span id="time">0.0</span></div><div class="pill">FINISH <span id="fin">0</span>/30</div><button id="stop" class="stop">STOP</button></div><div id="actionName"></div><div class="controls"><button id="guard" class="btn iconbtn" aria-label="防御"><img src="assets/防御.png" alt="" draggable="false"></button><div class="skills"><button id="s1" class="btn iconbtn" aria-label="水波斬"><img src="assets/水波斬.png" alt="" draggable="false"><span class="gauge"><i id="g1" style="width:100%"></i></span></button><button id="s2" class="btn iconbtn" aria-label="大陸斬"><img src="assets/大陸斬.png" alt="" draggable="false"><span class="gauge"><i id="g2" style="width:100%"></i></span></button></div></div><div id="intro" class="ov"><div class="card"><h1 class="title">魂の結束</h1><button id="start" class="btn big">START</button></div></div><div id="pause" class="ov hide"><div class="card"><h2>PAUSED</h2><button id="resume" class="btn big">RESUME</button></div></div><div id="result" class="ov hide"><div class="card"><h2 id="resultTitle"></h2><div id="resultText" class="result"></div><button id="retry" class="btn big">RETRY</button></div></div><script src="bgm.js"></script><script src="game.js"></script></body></html>
