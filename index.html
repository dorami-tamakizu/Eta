<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>3レーン剣戟ランナー</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;z-index:4;pointer-events:none}.p{background:#0009;border:1px solid #ffffff33;border-radius:10px;padding:7px 9px;font-weight:800;font-size:12px}.hp{flex:1}.bar{height:6px;background:#ffffff22;margin-top:4px;border-radius:9px;overflow:hidden}.fill{height:100%;background:white}.stop{pointer-events:auto;background:#101a2dcc;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:7px 10px;font-weight:900}.ctl{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;z-index:4}.btn{background:#101a2dcc;color:#fff;border:1px solid #ffffff55;border-radius:16px;font-weight:800}.guard{width:78px;height:78px}.skills{display:flex;gap:8px}.skill{width:88px;height:88px;position:relative}.skill.active{outline:3px solid white}.mini{font-size:11px;opacity:.7}.g{position:absolute;left:8px;right:8px;bottom:7px;height:6px;background:#ffffff22;border-radius:6px;overflow:hidden}.gf{height:100%;background:white}.ov{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#020610e8;padding:22px;text-align:center}.card{max-width:400px}.card h1,.card h2{margin:0 0 10px}.card p{line-height:1.6;opacity:.82;font-size:13px}.big{padding:13px 24px;font-size:17px}.hide{display:none}.flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;z-index:6;pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="p hp">HP <span id="hp">20/20</span><div class="bar"><div id="hpf" class="fill" style="width:100%"></div></div></div><div class="p">TIME <span id="tm">0.0</span></div><div class="p">FINISH <span id="fn">0</span>/30</div><button id="stop" class="stop">STOP</button></div><div class="ctl"><button id="guard" class="btn guard">防御<br><span class="mini">押し続ける</span></button><div class="skills"><button id="s1" class="btn skill active">水波斬<br><span class="mini">横・威力2</span><div class="g"><div id="g1" class="gf" style="width:100%"></div></div></button><button id="s2" class="btn skill">天地斬<br><span class="mini">縦・威力3</span><div class="g"><div id="g2" class="gf" style="width:100%"></div></div></button></div></div><div id="flash" class="flash"></div><div id="intro" class="ov"><div class="card"><h1>3レーン剣戟ランナー</h1><p>左右スワイプ＝レーン移動。画面タップ＝選択中スキル。スキルフィニッシュ直後0.3秒以内に上スワイプ＝スーパーダッシュ。左下を押している間は防御。</p><button id="start" class="btn big">START</button></div></div><div id="pause" class="ov hide"><div class="card"><h2>PAUSED</h2><button id="resume" class="btn big">RESUME</button></div></div><div id="result" class="ov hide"><div class="card"><h2 id="rt">STAGE CLEAR</h2><p id="rs"></p><button id="retry" class="btn big">RETRY</button></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),q=s=>document.querySelector(s),D={slime:{hp:2,d:1,r:0,t:.8,g:'●'},skeleton:{hp:3,d:2,r:0,t:.9,g:'☠'},mage:{hp:3,d:2,r:1,t:1,g:'◆'},bonobo:{hp:4,d:4,r:0,t:1.15,g:'■'},dragon:{hp:4,d:3,r:1,t:1.1,g:'▲'}};let W,H,S,last=0,ft;const R=(a,b)=>a+Math.random()*(b-a),I=(a,b)=>Math.floor(R(a,b+1)),C=(v,a,b)=>Math.max(a,Math.min(b,v));function sz(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function sh(a){for(let i=a.length-1;i;i--){let j=I(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function E(t,z){let d=D[t];return{t,h:d.hp,m:d.hp,l:I(0,2),z,dead:0,st:0,cd:R(1.7,3.5),tel:0,mv:R(.5,1.6),fl:0}}function roster(){let a=[],early=sh(['slime','slime','slime','skeleton','skeleton','skeleton']),rest=sh([...Array(6).fill('slime'),...Array(6).fill('skeleton'),...Array(6).fill('mage'),...Array(3).fill('bonobo'),...Array(3).fill('dragon')]);early.forEach((t,i)=>a.push(E(t,18+i*5.5+R(-1,1))));rest.forEach((t,i)=>a.push(E(t,48+i*(142/23)+R(-2,2))));return a}function reset(){S={run:0,pause:0,hp:20,dmg:0,time:0,z:0,l:1,guard:0,sel:1,ch:[5,5],fr:[0,0],skill:null,finish:0,win:0,dash:null,norm:0,en:roster(),shots:[],ptr:null};q('#result').classList.add('hide');ui()}function ui(){q('#hp').textContent=`${Math.max(0,Math.ceil(S.hp))}/20`;q('#hpf').style.width=C(S.hp/20*100,0,100)+'%';q('#tm').textContent=S.time.toFixed(1);q('#fn').textContent=S.finish;q('#g1').style.width=S.ch[0]/5*100+'%';q('#g2').style.width=S.ch[1]/5*100+'%';q('#s1').classList.toggle('active',S.sel===1);q('#s2').classList.toggle('active',S.sel===2)}function msg(t){q('#flash').textContent=t;clearTimeout(ft);ft=setTimeout(()=>q('#flash').textContent='',260)}function block(){let a=S.en.filter(e=>!e.dead&&e.z>=S.z-.1);return a.length?Math.min(...a.map(e=>e.z)):1e9}function adv(n){let b=block(),v=Math.min(n,Math.max(0,b-S.z-.65));S.z+=v;return v}function hurt(n){n=S.guard?n*.5:n;S.hp-=n;S.dmg+=n;if(S.hp<=0){S.hp=0;end(0)}}function hit(e,n,sk){if(e.dead)return;e.h-=n;if(sk){e.fl=.12;if(e.st){e.st=0;e.cd=R(1.8,3.6)}}if(e.h<=0){e.dead=1;if(sk){S.finish++;S.win=.3;msg('SKILL FINISH')}}}function fire(k){if(!S.run||S.pause||S.ch[k-1]<1)return;S.guard=0;S.ch[k-1]--;S.skill={k,t:0,d:k===1?.34:.42,h:0}}function lane(d){if(S.skill)S.skill=null;if(S.dash)S.dash=null;S.l=C(S.l+d,0,2)}function sd(){if(S.win<=0||!S.run||S.pause)return;S.skill=null;S.dash={r:10};S.win=0;msg('SUPER DASH')}function step(dt){if(!S.run||S.pause)return;S.time+=dt;S.win=Math.max(0,S.win-dt);for(let i=0;i<2;i++){if(S.ch[i]<5){S.fr[i]+=dt/5;while(S.fr[i]>=1&&S.ch[i]<5){S.ch[i]++;S.fr[i]--}}else S.fr[i]=0}if(S.skill){S.skill.t+=dt;let p=S.skill.t/S.skill.d;if(!S.skill.h&&p>=.34){S.skill.h=1;S.en.forEach(e=>{if(e.dead)return;let r=e.z-S.z;if(r<0)return;if(S.skill.k===1&&r<=1.15){let ok=S.l===1||(S.l===0&&(e.l===0||e.l===1))||(S.l===2&&(e.l===1||e.l===2));if(ok)hit(e,2,1)}else if(S.skill.k===2&&r<=2.15&&e.l===S.l)hit(e,3,1)})}if(S.skill&&S.skill.t>=S.skill.d)S.skill=null}if(S.dash){let want=42*dt,v=adv(want);S.dash.r-=v;if(v<want-.001||S.dash.r<=0)S.dash=null}else if(!S.guard&&!S.skill)adv(dt/.3);let ce=S.en.filter(e=>!e.dead&&e.l===S.l&&e.z-S.z<=1.05&&e.z-S.z>=-.1).sort((a,b)=>a.z-b.z)[0];if(ce){S.norm+=dt;if(S.norm>=2){S.norm-=2;hit(ce,1,0)}}else S.norm=0;for(let e of S.en){if(e.dead)continue;e.fl=Math.max(0,e.fl-dt);let r=e.z-S.z;if(r>40||r<-2)continue;if(e.st){e.tel-=dt;if(e.tel<=0){let d=D[e.t];if(d.r)S.shots.push({l:e.l,z:e.z,d:d.d,a:1});else if(r<=1.25&&e.l===S.l)hurt(d.d);e.st=0;e.cd=R(1.8,3.7)}}else{e.mv-=dt;if(e.mv<=0){if(Math.random()<.6){let o=[-1,1].filter(v=>e.l+v>=0&&e.l+v<=2);if(o.length)e.l+=o[I(0,o.length-1)]}e.z+=R(-.35,.12);e.mv=R(.6,1.8)}e.z-=.08*dt;e.cd-=dt;if(e.cd<=0){e.st=1;e.tel=D[e.t].t}}}for(let p of S.shots){if(!p.a)continue;p.z-=18*dt;if(p.z-S.z<=.35){if(p.l===S.l)hurt(p.d);p.a=0}}S.shots=S.shots.filter(p=>p.a);if(S.z>=200&&!S.en.some(e=>!e.dead))end(1);ui()}function lx(l,z){let p=C(1-z/34,0,1),sp=W*.055+(W*.25-W*.055)*p;return W/2+(l-1)*sp}function yy(z){let p=C(1-z/34,0,1);return H*.18+(H*.72-H*.18)*p}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1428');g.addColorStop(1,'#17243d');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffffff0b';x.beginPath();x.moveTo(W*.4,H*.18);x.lineTo(W*.6,H*.18);x.lineTo(W*.94,H);x.lineTo(W*.06,H);x.closePath();x.fill();x.strokeStyle='#ffffff28';for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(W/2+i*W*.055,H*.18);x.lineTo(W/2+i*W*.25,H);x.stroke()}for(let e of S.en.filter(e=>!e.dead&&e.z-S.z>-2&&e.z-S.z<38).sort((a,b)=>b.z-a.z)){let r=e.z-S.z,px=lx(e.l,r),py=yy(r),sc=C(1-r/40,.25,1.15);x.save();x.translate(px,py);if(e.st){x.globalAlpha=.25+.15*Math.sin(performance.now()/80);x.fillStyle='white';x.beginPath();x.arc(0,0,28*sc,0,7);x.fill();x.globalAlpha=1}x.fillStyle=e.fl?'#fff8':'#eaf0ff';x.beginPath();x.arc(0,0,16*sc,0,7);x.fill();x.fillStyle='#111';x.font=`${Math.max(12,20*sc)}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(D[e.t].g,0,1);x.fillStyle='#0008';x.fillRect(-18*sc,20*sc,36*sc,4*sc);x.fillStyle='white';x.fillRect(-18*sc,20*sc,36*sc*(e.h/e.m),4*sc);x.restore()}for(let p of S.shots){let r=p.z-S.z;if(r<0||r>38)continue;x.fillStyle='white';x.beginPath();x.arc(lx(p.l,r),yy(r),7,0,7);x.fill()}let px=lx(S.l,0),py=H*.72;x.save();x.translate(px,py);if(S.guard){x.strokeStyle='white';x.lineWidth=4;x.beginPath();x.arc(-18,-18,28,-2.3,2.3);x.stroke()}x.fillStyle='#d9e4ff';x.beginPath();x.arc(0,-44,12,0,7);x.fill();x.fillStyle='#2c5a47';x.beginPath();x.moveTo(-22,-28);x.lineTo(0,-2);x.lineTo(22,-28);x.lineTo(12,38);x.lineTo(-12,38);x.closePath();x.fill();x.fillStyle='#bd8d58';x.fillRect(-7,-34,14,38);x.strokeStyle='white';x.lineWidth=5;x.beginPath();x.moveTo(-4,4);x.lineTo(-16,35);x.moveTo(4,4);x.lineTo(16,35);x.stroke();if(S.skill){let p=S.skill.t/S.skill.d;x.strokeStyle='#dff7ff';x.lineWidth=8;x.lineCap='round';if(S.skill.k===1){let a=-2.5+p*3;x.beginPath();x.arc(0,-20,58,a-.7,a+.7);x.stroke()}else{let y=-88+p*75;x.beginPath();x.moveTo(0,y-25);x.lineTo(0,y+44);x.stroke()}}x.restore();if(S.win>0){x.fillStyle='white';x.font='900 16px sans-serif';x.textAlign='center';x.fillText('↑ SUPER DASH',W/2,H*.56)}}function end(ok){S.run=0;let ts=ok?Math.round(870000*C((75-S.time)/35,0,1)):0,fs=ok?Math.round(80000*C(S.finish/30,0,1)):0,ds=ok?Math.round(50000*C(1-S.dmg/20,0,1)):0;q('#rt').textContent=ok?'STAGE CLEAR':'GAME OVER';q('#rs').innerHTML=`TIME ${S.time.toFixed(2)}s<br>DAMAGE ${S.dmg.toFixed(1)}<br>SKILL FINISH ${S.finish}/30<br><b>TOTAL ${(ts+fs+ds).toLocaleString()}</b>`;q('#result').classList.remove('hide')}q('#start').onclick=()=>{reset();S.run=1;q('#intro').classList.add('hide')};q('#retry').onclick=()=>{reset();S.run=1;q('#result').classList.add('hide')};q('#stop').onclick=()=>{if(!S.run)return;S.pause=1;S.guard=0;q('#pause').classList.remove('hide')};q('#resume').onclick=()=>{S.pause=0;last=performance.now();q('#pause').classList.add('hide')};q('#s1').onpointerdown=e=>{e.stopPropagation();S.sel=1;ui()};q('#s2').onpointerdown=e=>{e.stopPropagation();S.sel=2;ui()};q('#guard').onpointerdown=e=>{e.stopPropagation();if(S.run&&!S.pause)S.guard=1};['pointerup','pointercancel','pointerleave'].forEach(v=>q('#guard').addEventListener(v,()=>S.guard=0));c.onpointerdown=e=>{if(S.run&&!S.pause)S.ptr={x:e.clientX,y:e.clientY}};c.onpointerup=e=>{if(!S.run||S.pause||!S.ptr)return;let dx=e.clientX-S.ptr.x,dy=e.clientY-S.ptr.y,ax=Math.abs(dx),ay=Math.abs(dy),t=28;if(ax<t&&ay<t)fire(S.sel);else if(ax>ay&&ax>t)lane(dx<0?-1:1);else if(ay>ax&&dy<-t)sd();S.ptr=null};reset();function loop(t){let dt=last?Math.min(.033,(t-last)/1000):0;last=t;step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
