.honor{display:flex;flex:1;align-items:center;flex-direction:column;gap:2px}.honor .rank-cup{width:43px;height:43px}.honor span{font-size:12px;color:#fff2d5}.honor strong{font-family:serif;font-size:20px;letter-spacing:.15em;text-shadow:0 2px 2px #401c0d}
