<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>3レーン剣戟ランナー</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;pointer-events:none}.pill{background:#0009;border:1px solid #ffffff33;border-radius:11px;padding:7px 9px;font-weight:800;font-size:12px;white-space:nowrap}.hp{flex:1}.bar{height:6px;margin-top:4px;background:#ffffff22;border-radius:8px;overflow:hidden}.fill{height:100%;background:#fff}.stop{pointer-events:auto;background:#101a2ddd;color:#fff;border:1px solid #ffffff55;border-radius:11px;padding:7px 10px;font-weight:900}.controls{position:fixed;z-index:5;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.btn{background:#101a2ddd;color:#fff;border:1px solid #ffffff55;border-radius:16px;font-weight:800;touch-action:none}.guard{width:80px;height:80px}.skills{display:flex;gap:8px}.skill{width:90px;height:90px;position:relative}.small{font-size:11px;opacity:.72}.gauge{position:absolute;left:8px;right:8px;bottom:8px;height:6px;background:#ffffff22;border-radius:8px;overflow:hidden}.gauge>i{display:block;height:100%;background:#fff}.ov{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#020610e9;padding:24px;text-align:center}.hide{display:none}.card{max-width:400px}.card h1,.card h2{margin:0 0 16px}.big{padding:13px 24px;font-size:17px}.result{line-height:1.8}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="pill hp">HP <span id="hp">20/20</span><div class="bar"><div id="hpf" class="fill" style="width:100%"></div></div></div><div class="pill">TIME <span id="time">0.0</span></div><div class="pill">FINISH <span id="fin">0</span>/30</div><button id="stop" class="stop">STOP</button></div><div class="controls"><button id="guard" class="btn guard">防御</button><div class="skills"><button id="s1" class="btn skill">水波斬<br><span class="small">威力2</span><div class="gauge"><i id="g1" style="width:100%"></i></div></button><button id="s2" class="btn skill">天地斬<br><span class="small">威力3</span><div class="gauge"><i id="g2" style="width:100%"></i></div></button></div></div><div id="intro" class="ov"><div class="card"><h1>3レーン剣戟ランナー</h1><button id="start" class="btn big">START</button></div></div><div id="pause" class="ov hide"><div class="card"><h2>PAUSED</h2><button id="resume" class="btn big">RESUME</button></div></div><div id="result" class="ov hide"><div class="card"><h2 id="resultTitle"></h2><div id="resultText" class="result"></div><button id="retry" class="btn big">RETRY</button></div></div><script src="game.js?v=5"></script></body></html>
