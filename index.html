<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>魂の結束</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}body{position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;pointer-events:none}.pill{background:#0009;border:1px solid #ffffff33;border-radius:11px;padding:7px 9px;font-weight:800;font-size:12px;white-space:nowrap}.hp{flex:1}.bar{height:10px;border:1px solid #00ff00;margin-top:4px;background:#ffffff22;border-radius:8px;overflow:hidden}.fill{height:100%;background:#00ff00}.stop{pointer-events:auto;background:#101a2ddd;color:#fff;border:1px solid #ffffff55;border-radius:11px;padding:7px 10px;font-weight:900}.controls{position:fixed;z-index:5;left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.btn{background:#101a2ddd;color:#fff;border:1px solid #ffffff55;border-radius:16px;font-weight:800;touch-action:none;-webkit-tap-highlight-color:transparent}.iconbtn{width:min(118px,calc((100vw - 24px)/3));height:min(118px,calc((100vw - 24px)/3));padding:0;overflow:hidden;position:relative;background:#101a2ddd}.iconbtn img{position:absolute;width:225%;height:225%;max-width:none;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;-webkit-user-drag:none;filter:hue-rotate(180deg) saturate(.72) brightness(1.08)}.iconbtn::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.iconbtn.flash::after{animation:tapFlash .32s ease-out}@keyframes tapFlash{0%{opacity:0}18%{opacity:.78}48%{opacity:.12}72%{opacity:.58}100%{opacity:0}}.skills{display:flex;gap:6px}.skill-ring{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}.ring-track,.ring-fill{fill:none;stroke-width:5}.ring-track{stroke:#07101ee6;stroke-width:8}.ring-fill{stroke:#8be9ff;stroke-linecap:butt;stroke-dasharray:100;stroke-dashoffset:0}#g2{stroke:#ffd87a}.iconbtn[aria-disabled="true"] .ring-fill{opacity:.65}.ov{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#020610e9;padding:24px;text-align:center}.hide{display:none}.card{max-width:400px}.card h1,.card h2{margin:0 0 16px}.title{font-size:36px;letter-spacing:.12em;text-shadow:0 3px 16px #000}.big{padding:13px 24px;font-size:17px}.result{line-height:1.8}#actionName{position:fixed;z-index:6;top:40%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 5px #000,0 0 10px #000;pointer-events:none;opacity:0;transition:opacity .06s;white-space:nowrap}.moveArrow{font-size:42px!important}.finish-stat{display:none}.hud{top:calc(12px + env(safe-area-inset-top));gap:8px}.pill{backdrop-filter:blur(10px);border-color:#d1e7dd40;background:#102722cc}.controls{padding:12px 6px 6px;background:linear-gradient(transparent,#071a24dd);gap:8px}.iconbtn{border:1px solid #d7cc9555;box-shadow:0 5px 20px #0008;border-radius:16px}.ov{background:linear-gradient(#06171988,#06131ff2)}.title{color:#fff0cc;font-family:serif}.subtitle{font-size:10px;letter-spacing:.2em;color:#cfc395}.instructions{font-size:13px;color:#d0dcd7;line-height:2;margin:26px 0}.big{background:linear-gradient(135deg,#395f54,#183d38);border-color:#b7c59788;min-width:160px}.stop{background:#142a26dd}#actionName{padding:4px 16px;background:linear-gradient(90deg,transparent,#102631cc,transparent);font-family:serif}.iconbtn[aria-disabled="true"] img{opacity:.4}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="pill hp">HP <span id="hp">20/20</span><div id="hpbar" class="bar"><div id="hpf" class="fill" style="width:100%"></div></div></div><div class="pill">TIME <span id="time">0.0</span></div><div class="pill">撃破 <span id="kills">0</span>/30</div><div class="pill finish-stat">FINISH <span id="fin">0</span>/30</div><button id="stop" class="stop">STOP</button></div><div id="actionName"></div><div class="controls"><button id="guard" class="btn iconbtn" aria-label="防御"><img src="assets/防御.png" alt="" draggable="false"></button><div class="skills"><button id="s1" class="btn iconbtn" aria-label="水波斬"><img src="assets/水波斬.png" alt="" draggable="false"><svg class="skill-ring" viewBox="0 0 118 118" aria-hidden="true" focusable="false"><path class="ring-track" d="M59 5H99A14 14 0 0 1 113 19V99A14 14 0 0 1 99 113H19A14 14 0 0 1 5 99V19A14 14 0 0 1 19 5H59Z"/><path id="g1" class="ring-fill" pathLength="100" d="M59 5H99A14 14 0 0 1 113 19V99A14 14 0 0 1 99 113H19A14 14 0 0 1 5 99V19A14 14 0 0 1 19 5H59Z"/></svg></button><button id="s2" class="btn iconbtn" aria-label="大陸斬"><img src="assets/大陸斬.png" alt="" draggable="false"><svg class="skill-ring" viewBox="0 0 118 118" aria-hidden="true" focusable="false"><path class="ring-track" d="M59 5H99A14 14 0 0 1 113 19V99A14 14 0 0 1 99 113H19A14 14 0 0 1 5 99V19A14 14 0 0 1 19 5H59Z"/><path id="g2" class="ring-fill" pathLength="100" d="M59 5H99A14 14 0 0 1 113 19V99A14 14 0 0 1 99 113H19A14 14 0 0 1 5 99V19A14 14 0 0 1 19 5H59Z"/></svg></button></div></div><div id="intro" class="ov"><div class="card"><h1 class="title">魂の結束</h1><p class="subtitle">SINGLE HERO · FOREST BATTLE</p><p class="instructions">スワイプで左右・前後へ移動<br>接近すると通常攻撃。剣技で前方の敵を突破。<br>防御は長押し、技の外周は残りチャージ。</p><button id="start" class="btn big">START</button></div></div><div id="pause" class="ov hide"><div class="card"><h2>PAUSED</h2><button id="resume" class="btn big">RESUME</button></div></div><div id="result" class="ov hide"><div class="card"><h2 id="resultTitle"></h2><div id="resultText" class="result"></div><button id="retry" class="btn big">RETRY</button></div></div><script src="bgm.js"></script><script src="sfx.js"></script><script src="game-poses.js"></script></body></html>
