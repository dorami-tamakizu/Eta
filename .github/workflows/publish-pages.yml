name: Publish checked GitHub Pages game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checked-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-pages-origin.cjs
      - run: node scripts/test.cjs
      - run: node scripts/package-pages.cjs
      - run: node scripts/check-pages-origin.cjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the checked workflow as the Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const before = await github.rest.repos.getPages(repo);
            if (before.data.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({...repo, build_type: 'workflow'});
            }
            const after = await github.rest.repos.getPages(repo);
            if (after.data.build_type !== 'workflow') throw new Error('Pages source is not workflow');
            core.info('Pages publishing source verified: workflow');
      - name: Publish only the checked artifact
        id: deployment
        uses: actions/deploy-pages@v4
