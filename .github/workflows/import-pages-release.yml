name: Prepare verified GitHub Pages release
on:
  push:
    branches: [restore-pages-20261011]
    paths:
      - pages-release-manifest.json
      - scripts/import-pages-release.cjs
      - .github/workflows/import-pages-release.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/import-pages-release.cjs
      - run: node scripts/check-pages-origin.cjs
      - run: |
          node --check menu.js
          node --check sample-ranking.js
          node --check ex/game.js
          test -f sword/assets/hero.webp
          test -f spear/index.html
          test -f ex/assets/boss-intro.mp4
      - name: Save prepared release on migration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import verified sword, spear and EX release for GitHub Pages'
          git push origin HEAD:restore-pages-20261011
